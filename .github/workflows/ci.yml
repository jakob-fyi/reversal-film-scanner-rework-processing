name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  format:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Verify formatting and analyzers
        run: dotnet format --verify-no-changes --no-restore

  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution ReversalFilmScanner.slnx --configuration Release --no-build
          --results-directory "${{ github.workspace }}/TestResults"
          --report-xunit-trx --report-xunit-markdown
          --coverage --coverage-output-format cobertura

      - name: Test summary
        if: ${{ !cancelled() }}
        shell: bash
        run: cat TestResults/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            -reports:"TestResults/**/*.cobertura.xml" \
            -targetdir:TestResults/coverage-report \
            -reporttypes:"MarkdownSummaryGithub;Cobertura;HtmlInline" \
            -assemblyfilters:"-*.Tests" \
            -filefilters:"-*/obj/*"
          cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Runs the real CLI against the sample scans - catches native SkiaSharp loading issues per OS.
      - name: Smoke test CLI
        shell: bash
        run: |
          scans="$RUNNER_TEMP/scans"
          mkdir -p "$scans"
          cp sample-images/*.JPG "$scans/"
          dotnet run --project src/ReversalFilmScanner.Rework.Cli --configuration Release --no-build -- "$scans" --prefix CI_
          test -f "$scans/CI_000001.JPG"
          test -f "$scans/CI_000002.JPG"
          test -z "$(find "$scans" -mindepth 1 -type d)" # backup directory was cleaned up

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          retention-days: 14
