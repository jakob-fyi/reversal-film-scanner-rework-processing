version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      skiasharp:
        patterns: ["SkiaSharp*"]
      testing:
        patterns: ["xunit*", "Microsoft.Testing.*", "NSubstitute", "TestableIO.*", "Spectre.Console.Testing"]
